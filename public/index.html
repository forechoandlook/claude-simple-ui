<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <!-- FOUC / calendar flash: decide before first paint -->
  <script>
  (function () {
    try {
      var theme = localStorage.getItem('theme') || 'dark';
      document.documentElement.setAttribute('data-theme', theme);
      var token = localStorage.getItem('token');
      var hash = location.hash || '';
      var restore = !!(token && /^#\/session\//.test(hash));
      document.documentElement.classList.add('boot-pending');
      if (restore) document.documentElement.classList.add('boot-restore');
      if (token) document.documentElement.classList.add('boot-authed');
    } catch (e) {
      document.documentElement.classList.add('boot-pending');
    }
  })();
  </script>
  <style>
    /* Hide app tree until JS has built the correct first screen */
    html.boot-pending #root {
      visibility: hidden !important;
    }
    html.boot-ready #root {
      visibility: visible !important;
    }
    /* If a cached/incomplete module cannot start, do not leave a standalone
       iOS/Android window as a featureless dark screen. */
    #boot-fallback {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background: #0f172a;
      color: #e2e8f0;
      font: 15px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-align: center;
    }
    #boot-fallback-error { display: none; }
    html.boot-ready #boot-fallback { display: none; }
    html.boot-timeout #boot-fallback-loading { display: none; }
    html.boot-timeout #boot-fallback-error { display: block; }
    /* Session deep-link: never show welcome calendar during boot */
    html.boot-restore #welcome {
      display: none !important;
      visibility: hidden !important;
      pointer-events: none !important;
    }
    html.boot-restore #project-view {
      display: flex !important;
      flex-direction: column !important;
      flex: 1 1 0 !important;
      min-height: 0 !important;
      overflow: hidden !important;
    }
    html.boot-restore #auth-screen,
    html.boot-authed #auth-screen {
      display: none !important;
    }
  </style>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#0f172a">
  <meta name="color-scheme" content="dark light">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Agent UI">
  <meta name="application-name" content="Agent UI">
  <meta name="description" content="Claude · Codex · Grok multi-machine agent console">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/icon-180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png">
  <title>Agent UI</title>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5/daisyui.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@9/marked.min.js"></script>
  <link id="hljs-theme" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11/styles/github-dark.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11/highlight.min.js"></script>
  <link rel="stylesheet" href="style.css?v=ui-11">
</head>
<body class="h-dvh overflow-hidden flex flex-col bg-base-100 text-base-content">
  <div id="root" class="flex flex-col flex-1 overflow-hidden"></div>
  <div id="boot-fallback" role="status" aria-live="polite">
    <div id="boot-fallback-loading">正在打开 Agent UI…</div>
    <div id="boot-fallback-error">应用未能完成加载。请确认网络和服务可用，然后刷新或从主屏幕重新打开。</div>
  </div>
  <script>
    setTimeout(function () {
      if (document.documentElement.classList.contains('boot-pending')
        && !document.documentElement.classList.contains('boot-ready')) {
        document.documentElement.classList.add('boot-timeout');
      }
    }, 10000);
  </script>
  <script type="module" src="app.js?v=ui-11"></script>
</body>
</html>
