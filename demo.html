<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>极简 Signal + Props + 自动依赖追踪</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4/dist/full.min.css" rel="stylesheet">
</head>
<body class="bg-base-100">
  <div id="app"></div>

  <script>
    // ==================== 核心：Signal 系统（带自动依赖追踪） ====================
    let currentEffect = null;   // 当前正在执行的 effect / computed

    class Signal {
      constructor(value) {
        this._value = value;
        this._listeners = new Set();
      }

      get value() {
        // 自动依赖收集：如果当前有正在运行的 computed，就订阅它
        if (currentEffect) {
          this._listeners.add(currentEffect);
        }
        return this._value;
      }

      set value(newValue) {
        if (this._value === newValue) return;
        this._value = newValue;
        this._listeners.forEach(fn => fn());   // 触发所有依赖更新
      }

      subscribe(fn) {
        this._listeners.add(fn);
        return () => this._listeners.delete(fn);
      }
    }

    // computed（自动追踪依赖）
    function computed(fn) {
      const signal = new Signal(null);

      const effect = () => {
        const prevEffect = currentEffect;
        currentEffect = effect;           // 标记当前正在计算
        try {
          signal._value = fn();           // 执行计算，自动收集依赖
        } finally {
          currentEffect = prevEffect;
        }
      };

      effect();   // 立即执行一次
      return signal;
    }

    // watch
    function watch(source, callback) {
      let oldValue = source.value;
      return source.subscribe(() => {
        const newValue = source.value;
        if (newValue !== oldValue) {
          callback(newValue, oldValue);
          oldValue = newValue;
        }
      });
    }

    // ==================== 组件系统（支持 props） ====================
    function defineComponent(renderFn) {
      return (props = {}) => renderFn(props);
    }

    // ==================== 示例组件 ====================
    const Header = defineComponent((props) => `
      <div class="navbar bg-base-200 shadow">
        <div class="flex-1">
          <h1 class="text-2xl font-bold px-4">${props.title || '我的应用'}</h1>
        </div>
        <div class="flex-none">
          <button onclick="globalThis.addItem()" class="btn btn-primary">新增</button>
        </div>
      </div>
    `);

    const ItemCard = defineComponent((props) => `
      <div class="card bg-base-200 shadow-md p-6 flex justify-between items-center">
        <div>
          <div class="text-xl font-medium">${props.name}</div>
          <div class="text-sm text-base-content/70">${props.desc || '暂无描述'}</div>
        </div>
        <div class="flex gap-3">
          <button onclick="globalThis.toggleActive(${props.id})" 
                  class="btn ${props.active ? 'btn-success' : 'btn-ghost'}">
            ${props.active ? '✅ 在职' : '❌ 离职'}
          </button>
          <button onclick="globalThis.deleteItem(${props.id})" 
                  class="btn btn-error">删除</button>
        </div>
      </div>
    `);

    // ==================== 全局状态 ====================
    const items = new Signal([
      { id: 1, name: "张三", desc: "前端工程师", active: true },
      { id: 2, name: "李四", desc: "产品经理", active: true },
      { id: 3, name: "王五", desc: "UI设计师", active: false }
    ]);

    const searchTerm = new Signal('');

    // 自动计算过滤后的列表（依赖追踪完美工作）
    const filteredItems = computed(() => {
      const term = searchTerm.value.toLowerCase().trim();
      if (!term) return items.value;
      return items.value.filter(item =>
        item.name.toLowerCase().includes(term) ||
        (item.desc || '').toLowerCase().includes(term)
      );
    });

    // ==================== 业务函数 ====================
    globalThis.addItem = () => {
      const newItem = {
        id: Date.now(),
        name: `新成员${items.value.length + 1}`,
        desc: "待完善信息",
        active: true
      };
      items.value = [...items.value, newItem];
    };

    globalThis.deleteItem = (id) => {
      if (confirm('确定删除？')) {
        items.value = items.value.filter(item => item.id !== id);
      }
    };

    globalThis.toggleActive = (id) => {
      items.value = items.value.map(item =>
        item.id === id ? { ...item, active: !item.active } : item
      );
    };

    // ==================== 主 App 组件 ====================
    const App = defineComponent(() => `
      <div class="min-h-screen bg-base-100">
        ${Header({ title: '极简 Signal + Props 示例' })}

        <div class="max-w-4xl mx-auto p-6">
          <!-- 搜索 -->
          <input 
            type="text" 
            placeholder="搜索姓名或描述..."
            value="${searchTerm.value}"
            oninput="searchTerm.value = this.value"
            class="input input-bordered w-full mb-8" />

          <!-- 数据列表 -->
          <div class="space-y-4">
            ${filteredItems.value.length === 0 
              ? `<p class="text-center py-12 text-base-content/60">没有找到匹配的数据</p>`
              : filteredItems.value.map(item => 
                  ItemCard({
                    id: item.id,
                    name: item.name,
                    desc: item.desc,
                    active: item.active
                  })
                ).join('')
            }
          </div>

          <div class="text-center text-sm mt-8 text-base-content/50">
            当前共 ${filteredItems.value.length} 条数据 • 纯 JS 实现
          </div>
        </div>
      </div>
    `);

    // ==================== 渲染引擎 ====================
    function render() {
      const htmlString = App();
      document.getElementById('app').innerHTML = htmlString;
    }

    // 监听所有重要信号变化，自动重新渲染
    items.subscribe(render);
    searchTerm.subscribe(render);
    filteredItems.subscribe(render);

    // 启动
    render();
  </script>
</body>
</html>
